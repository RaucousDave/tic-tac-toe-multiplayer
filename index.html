<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <h1 class="page-title">TIC TAC TOE</h1>
    <div class="scoreboard">
      <div class="flex min-w-16 flex-col items-center">
        <span class="player-role">Player X</span>
        <span class="player-score">0</span>
      </div>

      <div class="flex min-w-16 flex-col items-center">
        <span class="player-role">Player O</span>
        <span class="player-score">0</span>
      </div>
    </div>

    <section class="game-container">
      <div class="room-panel">
        <label for="invite-link">Invite link</label>
        <div class="room-link-row">
          <input id="invite-link" type="text" readonly />
          <button id="copy-invite" type="button">Copy</button>
        </div>
      </div>

      <div class="grid-container">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <span id="announcement"></span>
      <button
        class="reset-button"
        onclick="resetGame()"
      >
        Reset Game
      </button>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
