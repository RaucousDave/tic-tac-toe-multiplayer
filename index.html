<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <h1 class="text-center font-black text-4xl mt-12">TIC TAC TOE</h1>
    <div class="scoreboard">
      <div class="flex min-w-16 flex-col items-center">
        <span class="player-role">Player X</span>
        <span class="player-score">0</span>
      </div>

      <div class="flex min-w-16 flex-col items-center">
        <span class="player-role">Player O</span>
        <span class="player-score">0</span>
      </div>
    </div>

    <section class="game-container">
      <div class="grid-container">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <span id="announcement"></span>
      <button
        onclick="resetGame()"
        style="
          margin-top: 20px;
          padding: 10px 20px;
          font-size: 16px;
          cursor: pointer;
        "
      >
        Reset Game
      </button>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
